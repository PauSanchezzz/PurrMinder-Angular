<app-header />

<article class="pt-32">
  <div class="flex items-center justify-center">
    <h2 class="font-extrabold text-3xl tracking-wide text-center max-md:text-4xl max-md:mr-2 text-darkPinkText">
      Registro ingreso del Felino</h2>
  </div>

  <form class="flex flex-col justify-center items-center">
    <section class="grid grid-cols-2 mx-20 pt-[65px] max-sm:grid-cols-1 max-sm:mx-0 max-sm:pt-8">

      <section class="grid gap-5 mr-16 max-sm:mx-5">

        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Nombre del felino:</p>
          <input
            class="bg-gray-50 border border-pink-900 text-lg rounded-2xl p-[6px] focus:outline-none focus:ring focus:ring-pink-100 text-center flex-1"
            type="text" id="nombre_felino" placeholder="Nombre Felino" required />
        </section>

         <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Edad:</p>
          <input
            class="bg-gray-50 border border-pink-900 text-lg rounded-2xl p-[6px] focus:outline-none focus:ring focus:ring-pink-100 text-center flex-1 max-sm:w-5"
            type="text" id="edad_felino" placeholder="Edad" required />
          <select id="edad_select" formControlName="edad_select"
            class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1 max-sm:w-5">
            <option selected>Seleccione</option>
            <option value="1">1 año</option>
            <option value="2">2 años</option>
            <option value="3">3 años</option>
          </select>
        </section>
        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Peso:</p>
          <input
            class="bg-gray-50 border border-pink-900 text-lg rounded-2xl p-[6px] focus:outline-none focus:ring focus:ring-pink-100 text-center flex-1 max-sm:w-5"
            type="text" id="peso_felino" placeholder="Peso" required />
          <select id="peso_select" formControlName="peso_select"
            class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1 max-sm:w-5">
            <option selected>Seleccione</option>
            <option value="1">1 kg</option>
            <option value="2">2 kg</option>
            <option value="3">3 kg</option>
          </select>
        </section>
        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Sexo:</p>
          <select id="sexo_select" formControlName="sexo_select"
            class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1">
            <option selected>Seleccione</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </section>
        <section class="flex flex-col justify-center items-center">
          <p class="text-lg font-bold text-darkPinkText pb-3">¿Disponible para adopción?</p>
          <div class="grid grid-cols-2 gap-5">

            <div class="grid grid-cols-2 gap-2 items-center">
              <input type="radio" class="w-4 h-4 accent-pink-500" name="colored-radio">
              <label for="red-radio" class="text-lg font-bold text-darkPinkText">Sí</label>
            </div>
            <div class="grid grid-cols-2 gap-2 items-center">
              <input type="radio" class="w-4 h-4 accent-pink-500" name="colored-radio">
              <label for="red-radio" class="text-lg font-bold text-darkPinkText">No</label>
            </div>
          </div>
        </section>
      </section>
      <section class="grid gap-5 mr-16 max-sm:mx-5">
        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Personalidad:</p>
          <select id="personalidad" formControlName="personalidad"
            class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1">
            <option selected>Seleccione</option>
            <option value="1">Amigable</option>
            <option value="2">Tímido</option>
            <option value="3">Juguetón</option>
          </select>
        </section>
        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Descripción:</p>
          <textarea
            class="caret-pink-800 bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1 "
            name="descripcion"></textarea>
        </section>
        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Estado del Felino:</p>
          <select id="estado_felino" formControlName="estado_felino"
            class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1">
            <option selected>Seleccione</option>
            <option value="1">Sano</option>
            <option value="2">En tratamiento</option>
            <option value="3">Recuperado</option>
          </select>
        </section>

        <section class="flex items-center space-x-2">
          <p class="titleFormCatRegister max-sm:text-start">Foto del Felino:</p>
          <label class="">
            <input type="file"
              class=" w-full text-sm font-semibold text-slate-500 file:mr-4 file:py-2 file:px-4 file:border file:border-pink-900 file:rounded-full file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-900 hover:file:bg-pink-100 flex-1" />
          </label>
        </section>

        <section class="flex items-center justify-center max-sm:justify-normal">
          <p
            class="text-lg font-bold text-darkPinkText text-center w-52 pr-8 max-sm:w-36 max-sm:pr-0 max-sm:text-start">
            ¿Cuenta con alguna condición especial?
          </p>
          <div class="grid gap-2">
            <div class="grid grid-cols-2 gap-3 justify-items-center">
              <div class="grid grid-cols-2 gap-2 items-center">
                <input type="radio" class="w-4 h-4 accent-pink-500" name="colored-radio">
                <label for="red-radio" class="text-lg font-bold text-darkPinkText">Sí</label>
              </div>
              <div class="grid grid-cols-2 gap-2 items-center">
                <input type="radio" class="w-4 h-4 accent-pink-500" name="colored-radio">
                <label for="red-radio" class="text-lg font-bold text-darkPinkText">No</label>
              </div>
            </div>
            <div class="flex">
              <p class="text-lg font-bold text-darkPinkText text-centerp pr-4">¿Cúal?</p>

              <select id="detalle_condicion" formControlName="detalle_condicion"
                class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] flex-1 max-sm:flex-none">
                <option selected>Seleccione</option>
                <option value="1">Condición A</option>
                <option value="2">Condición B</option>
                <option value="3">Condición C</option>
              </select>
            </div>
          </div>
        </section>

      </section>
    </section>

    <button type="submit"
      class="mt-16 max-sm:my-5 bg-lightPinkSecond border-2 border-lightPink py-2 px-8 rounded-lg font-bold text-darkPinkText hover:bg-lightPink hover:border-darkPinkText hover:text-white transition ease-in-out delay-150 hover:-translate-y-1">
      Guardar
    </button>

  </form>

</article>
