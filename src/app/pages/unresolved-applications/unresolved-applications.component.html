<app-header />
<div class="flex flex-col items-center justify-center mt-32">
  <h2 class="font-extrabold text-3xl tracking-wide text-center max-md:text-4xl max-md:mr-2 text-darkPinkText">
    Solicitudes de Adopción</h2>
</div>


<div class="relative overflow-x-auto shadow-md sm:rounded-lg mx-16 pt-14">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 ">
    <thead class="text-xs text-darkPinkText uppercase bg-[#F4BBD8] ">
      <tr>
        <th scope="col" class="p-4">
          <div class="flex items-center">
          </div>
        </th>
        <th scope="col" class="px-6 py-3 text-center">
          Nombre
        </th>
        <th scope="col" class="px-6 py-3 text-center">
          Foto
        </th>
        <th scope="col" class="px-6 py-3 text-center">
          Ver solicitud
        </th>
        <th scope="col" class="px-6 py-3 text-center">
          Anotación
        </th>
        <th scope="col" class="px-6 py-3 text-center">
          Estado
        </th>
      </tr>
    </thead>
    <tbody>
      @for (item of catsRequestedList; track $index) {
      <tr class="bg-white border-b hover:bg-gray-50 ">
        <td class="w-4 p-4">
          <div class="flex items-center">
          </div>
        </td>
        <th scope="row" class="px-6 py-2 font-medium text-gray-900 whitespace-nowrap text-center">
          {{item.nameCat}}
        </th>
        <td class="px-6 py-2  place-items-center">
          <img class="rounded-lg size-20 object-cover" [src]="'http://127.0.0.1:8000/storage/'+item.imageCat" alt="" />
        </td>
        <td class="px-6 py-2 text-center">
          <button type="button"
            class="focus:outline-none text-darkPinkText border-[1px] border-darkPinkText bg-pink-200 hover:bg-pink-300 focus:ring-4 focus:ring-pink-300 font-medium rounded-lg text-sm px-5 py-2.5 mb-2 ">Formulario</button>
        </td>
        <td class="text-center mx-8">
          <textarea
            class="caret-pink-800 bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] w-full"
            name="comments" id="comments" formControlName="comments"></textarea>
        </td>
        <td class="px-6 pt-5 grid grid-cols-2 place-items-center">
          <a href=""><img class="size-12" src="svg/ok.svg" alt=""></a>
          <a href=""><img class="size-12" src="svg/no.svg" alt=""></a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
