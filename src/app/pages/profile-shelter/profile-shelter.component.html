<app-header />
<div class="flex flex-col items-center justify-center min-h-screen pt-28 max-sm:mx-6 max-sm:pt-28">
  <h2 class="text-5xl font-extrabold text-darkPinkText text-center max-sm:text-4xl">Perfil Hogar de Paso</h2>
  <form class=" flex flex-col items-center justify-center pt-14
    max-sm:py-8">

    <section class="grid grid-cols-3 gap-7 w-[80rem] max-sm:grid-cols-1 max-sm:w-full ">

      <section class="h-10">

        <p class="titleStyle">Correo:</p>
        <input type="email" id="email" formControlName="email" class="inputStyle" [value]="email" readonly required />

      </section>

      <section class="h-10 max-sm:mt-9">
        <p class="titleStyle">Nombre del responsable:</p>
        <input type="text" id="name" formControlName="name" class="inputStyle" [value]="name" readonly required />
      </section>

      <section class="h-10 max-sm:mt-9">
        <p class="titleStyle">Apellido del responsable:</p>
        <input type="text" id="lastName" formControlName="lastName" class="inputStyle" [value]="lastName" readonly
          required />
      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Tipo de Documento:</p>

        <select id="documentType_id" formControlName="documentType_id" class="selectStyle">
          <option value="">Cédula de Ciudadanía - CC</option> <!-- TODO -->
        </select>

      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Numero de Documento:</p>
        <input type="number" id="documentNumber" formControlName="documentNumber" class="inputStyle"
          [value]="documentNumber" readonly required />

      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Fecha Nacimiento Responsable:</p>
        <input type="date" id="birthDate" formControlName="birthDate" class=" inputStyle" [value]="birthDate" readonly
          required />

      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Nombre del Hogar de Paso:</p>
        <input type="text" id="nameShelter" formControlName="nameShelter" class="inputStyle" value="Huellitas Feliz"
          required /><!-- TODO -->

      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Telefono:</p>
        <input type="number" id="telephoneNumber" formControlName="telephoneNumber" class="inputStyle"
          [value]="telephoneNumber" readonly required />

      </section>

      <section class="h-10 mt-9">
        <p class="titleStyle">Dirección del Hogar de Paso:</p>
        <input type="text" id="address" formControlName="address" class="inputStyle" value="Cll 90 b sur #55 x - 33" required /><!-- TODO -->

      </section>

    </section>
    <div class="flex flex-col items-center justify-center mt-20">
      <h2 class="font-extrabold text-2xl tracking-wide text-center max-md:text-4xl max-md:mr-2 text-darkPinkText">
        ¿Que opción desea realizar?</h2>
    </div>
    <section class="grid grid-cols-2 gap-16 my-12">
      <div class="flex flex-col items-center justify-center">
        <a href="#"><img class="size-14" src="svg/update.svg" alt=""></a>
        <p class="pt-2 font-extrabold text-lg text-center text-darkPinkText">
          Actualizar</p>
      </div>
      <div class="flex flex-col items-center justify-center">
        <a href="#"><img class="size-14" src="svg/delete.svg" alt=""></a>
        <p class="pt-2 font-extrabold text-lg text-center text-darkPinkText">Eliminar</p>
      </div>
    </section>

  </form>


</div>
