<app-header />

<article class="pt-32">
  <div class="flex flex-col items-center justify-center">
    <h2 class="font-extrabold text-3xl tracking-wide text-center max-md:text-4xl max-md:mr-2 text-darkPinkText">
      Modulo de Registros</h2>
    <p class="font-extrabold text-lg tracking-wide text-center max-md:text-4xl max-md:mr-2 text-lightPink py-5">
      Seleccione el tipo de registro</p>

    <select id="typeRegister" [(ngModel)]="typeRegister"
      class="text-center bg-gray-50 border border-pink-900 text-lg rounded-2xl focus:outline-none focus:ring focus:ring-pink-100 p-[6px] w-52 max-sm:w-5 mb-16">
      <option selected>Seleccione</option>
      <option value="1">Reintegro</option>
      <option value="2">Medico</option>
      <option value="3">Defunción</option>
    </select>

    @if (typeRegister==='2') {
    <app-form-medical />
    } @else if (typeRegister==='3') {
    <app-form-death />
    }

  </div>
</article>
