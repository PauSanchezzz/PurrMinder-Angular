<app-header />
<div class="relative pt-40">
  <div class="flex items-center justify-center pb-20">
    <h2 class="font-extrabold text-3xl tracking-wide text-center max-md:text-4xl max-md:mr-2 text-darkPinkText">
      Seleccione la opción que desee realizar</h2>
  </div>
  <swiper-container init="false" class="mx-20 flex items-center justify-center">
    @for (item of optionsMenu; track $index) {
    <swiper-slide>
      <div class="slide-custom">
        <app-card-menu-shelter [urlCard]="item.urlCard" [imgCard]="item.imgCard" [titleCard]="item.titleCard" />
      </div>
    </swiper-slide>
    }
  </swiper-container>
  <div class="mb-28 swiper-pagination"></div>
  <section class="pt-64">
    <button
      class="bg-pink-200 border-2 border-pink-900 rounded-full size-14 text-pink-900 font-extrabold swiper-button-prev">
    </button>

    <button
      class="bg-pink-200 border-2 border-pink-900 rounded-full size-14 text-pink-900 font-extrabold swiper-button-next">
    </button>
  </section>
</div>
